services:
  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: ceap-label-studio
    ports:
      - "8085:8080"
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/data
      - LABEL_STUDIO_BASE_DATA_DIR=/label-studio/data
      - USE_DEFAULT_BANNED_SUBNETS=false
    volumes:
      - ./label_studio_data:/label-studio/data
      - /media/ssd2/datasets/CEAP:/data/pdfs:ro
      - ./data/processed/rendered_pages:/data/images:ro
    restart: unless-stopped
    networks:
      - ceap-label-net

networks:
  ceap-label-net:
    driver: bridge
