[project]
name = "dados"
version = "0.2.0"
description = "Pipeline de classificação, clusterização e rotulagem ativa de comprovantes fiscais da CEAP (Câmara dos Deputados)."
readme = "README.md"
authors = [{ name = "Lucas" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "psycopg[binary]>=3.3.6",
    "faiss-cpu>=1.10.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24", "pillow>=10.0"]
ocr = ["rapidocr-onnxruntime", "opencv-python-headless"]
ml = ["torch", "transformers", "scikit-learn", "joblib", "umap-learn", "tqdm"]
viz = ["plotly>=5.20", "scikit-learn"]
gemini = ["google-genai", "python-dotenv"]
api = ["fastapi>=0.110", "uvicorn>=0.28", "scikit-learn>=1.4", "joblib>=1.3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ceap-download-metadata = "dados.ceap.download:main"
ceap-download-urls = "dados.ceap.download_url:main"
ceap-download-pdfs = "dados.ceap.download_pdfs:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
